<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =========================================
         ADMIN FAVICON / CHURCH LOGO
    ========================================== -->

    <!-- Browser Tab Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- PNG Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/church-logo.png"
      sizes="1024x1024"
    />

    <!-- Apple Devices -->
    <link rel="apple-touch-icon" href="/church-logo.png" />

    <!-- =========================================
         RESPONSIVE
    ========================================== -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =========================================
         ADMIN DASHBOARD TITLE
    ========================================== -->

    <title>Church Admin Portal | St. Mary & St. Gabriel</title>

    <!-- =========================================
         DESCRIPTION
    ========================================== -->

    <meta
      name="description"
      content="Official administration portal for St. Mary & St. Gabriel Ethiopian Orthodox Tewahedo Church. Securely manage members, registrations, contributions, events, services, bookings, and church information."
    />

    <!-- =========================================
         AUTHOR
    ========================================== -->

    <meta
      name="author"
      content="St. Mary & St. Gabriel Ethiopian Orthodox Tewahedo Church"
    />

    <!-- =========================================
         THEME COLOR
    ========================================== -->

    <meta name="theme-color" content="#5B1A1A" />

    <!-- =========================================
         SEARCH ENGINE SETTINGS
         ADMIN DASHBOARD SHOULD NOT BE INDEXED
    ========================================== -->

    <meta name="robots" content="noindex, nofollow, noarchive" />

    <!-- =========================================
         OPEN GRAPH
    ========================================== -->

    <meta
      property="og:title"
      content="Church Admin Portal | St. Mary & St. Gabriel"
    />

    <meta
      property="og:description"
      content="Official administration portal for St. Mary & St. Gabriel Ethiopian Orthodox Tewahedo Church."
    />

    <meta property="og:type" content="website" />

    <meta property="og:image" content="/church-logo.png" />

    <!-- =========================================
         KEYWORDS
    ========================================== -->

    <meta
      name="keywords"
      content="St Mary St Gabriel Church Admin, Ethiopian Orthodox Church Admin, Church Administration Portal, Church Management System, Church Members Management, Church Registration Management, Church Events Management, Church Contributions, Orthodox Tewahedo Church"
    />

    <!-- =========================================
         MOBILE APP SETTINGS
    ========================================== -->

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Church Admin Portal" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- =========================================
         LANGUAGE
    ========================================== -->

    <meta http-equiv="content-language" content="en" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
